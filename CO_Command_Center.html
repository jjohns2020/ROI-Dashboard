 const q=CLIENTS.filter(c=>c.review&&c.review.status==='Submitted'&&canApprove(c)).length;
 $('#tabs').innerHTML=views().map(v=>`<button type="button" class="tab ${v[0]===view?'active':''}" data-v="${v[0]}">${v[1]}${v[0]==='queue'&&q?` <span class="badge">${q}</span>`:''}</button>`).join('');
 $$('.tab').forEach(b=>b.addEventListener('click',()=>{if(editing&&!confirmLeave())return;view=b.dataset.v;editing=false;render()}));
 $('#legend').innerHTML=`<div><span class="dot" style="background:${C.teal}"></span>Green · engaged, no risks</div><div><span class="dot" style="background:${C.orange}"></span>Yellow · some concerns</div><div><span class="dot" style="background:${C.magenta}"></span>Red · risk</div>`}
const confirmLeave=()=>{editing=false;draft=null;return true};
function openClient(id){cur=id;view='review';editing=false;render()}
function bindOpen(){$$('[data-c]').forEach(b=>b.addEventListener('click',e=>{if(e.target.closest('button[data-act]'))return;openClient(b.dataset.c)}))}
/* ---------- shared pieces ---------- */
function pillarDots(s){return DIM.map(([k,l])=>{const b=band(s.p[k]);return `<span class="pd" title="${l}: ${s.p[k]??'not rated'}"><span class="dot" style="background:${b[3]};margin:0"></span>${l.replace('Client ','').replace(' (ROI)','')}</span>`}).join('')}
function card(c){const h=health(c),s=h.s,rv=c.review;
 return `<button type="button" class="hc" data-c="${c.id}"><div class="top">${ring(s.overall)}<div style="min-inline-size:0"><div class="nm">${esc(c.name)}</div><div class="meta">${esc(c.loc)} · ${esc(FULL[c.con]||c.con)}</div><div style="margin-block-start:4px;display:flex;gap:6px;flex-wrap:wrap">${rag(h.final)}${stChip(rv?rv.status:'Not started')}</div></div></div>
 <div style="margin-block-start:10px">${pillarDots(s)}</div>${h.mismatch?`<p class="warnline">⚠ Consultant rating (${RAGC[h.cr][0]}) differs from the data (${RAGC[h.calc][0]})</p>`:''}
 <div class="meta" style="color:${C.blue};font-weight:600;margin-block-start:8px">Open client review →</div></button>`}
function kpis(list){const hs=list.map(health);const sc=hs.map(h=>h.s.overall).filter(v=>v!=null);const avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null;
 const red=hs.filter(h=>h.final==='R').length,yel=hs.filter(h=>h.final==='Y').length;
 const roi=list.reduce((a,c)=>a+((c.ops?c.ops.roi.total:c.row.total)||0),0);
 const due=list.filter(c=>!c.review||c.review.status==='Not started'||(ageMonths(c.review.date)||0)>6).length;
 return `<div class="kpis"><div class="kpi"><div class="l">Average client health</div><div class="v" style="color:${band(avg)[3]}">${avg??'—'}</div><div class="n">${chip(avg)}</div></div>
 <div class="kpi" style="border-block-start-color:${C.magenta}"><div class="l">Red / Yellow</div><div class="v" style="color:${C.magenta}">${red} / ${yel}</div><div class="n">clients needing attention</div></div>
 <div class="kpi" style="border-block-start-color:${C.purple}"><div class="l">2025 ROI value</div><div class="v" style="color:${C.purple}">${fm(roi)}</div><div class="n">latest review per client</div></div>
 <div class="kpi" style="border-block-start-color:${C.orange}"><div class="l">Reviews due</div><div class="v" style="color:${C.orange}">${due}</div><div class="n">not started or older than 6 months</div></div></div>`}
/* ---------- views ---------- */
function vTeam(){
 const cons=[...new Set(CLIENTS.map(c=>c.con))].filter(x=>x&&x!=='N/A').sort();
 const stats=cons.map(k=>{const l=CLIENTS.filter(c=>c.con===k),hs=l.map(health),sc=hs.map(h=>h.s.overall).filter(v=>v!=null);
  return {k,n:l.length,avg:sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null,r:hs.filter(h=>h.final==='R').length,y:hs.filter(h=>h.final==='Y').length,g:hs.filter(h=>h.final==='G').length,
   rev:l.filter(c=>c.review&&c.review.status!=='Not started').length,sub:l.filter(c=>c.review&&c.review.status==='Submitted').length,stale:l.filter(c=>c.review&&(ageMonths(c.review.date)||0)>6).length,roi:l.reduce((a,c)=>a+((c.ops?c.ops.roi.total:c.row.total)||0),0)}});
 const unassigned=CLIENTS.filter(c=>c.con==='N/A').length;
 const watch=CLIENTS.map(c=>({c,h:health(c)})).filter(x=>x.h.final==='R'||x.h.mismatch||(x.c.review&&x.c.review.risk.some(r=>r[1]==='R'))).slice(0,12);
 $('#main').innerHTML=`<div class="banner">🔒 <b>INTERNAL ONLY.</b> Team view across consultants. Never share with clients.</div><p class="title">Team overview</p><p class="subtitle">${CLIENTS.length} active clients · ${cons.length} consultants${unassigned?` · ${unassigned} clients with no consultant assigned`:''}</p>
 ${kpis(CLIENTS)}
 <div class="card"><h4>By consultant</h4><table><tr><th>Consultant</th><th class="num">Clients</th><th class="num">Avg health</th><th>Green / Yellow / Red</th><th class="num">Reviews on file</th><th class="num">Older than 6 mo</th><th class="num">Awaiting approval</th><th class="num">2025 ROI</th></tr>
 ${stats.map(s=>`<tr class="click" data-con="${esc(s.k)}"><td><b>${esc(FULL[s.k]||s.k)}</b></td><td class="num">${s.n}</td><td class="num">${s.avg??'—'} ${s.avg!=null?chip(s.avg):''}</td><td><span class="chip" style="background:#D7F2EF;color:#00756E">${s.g}</span> <span class="chip" style="background:#FFF1E0;color:#B35F00">${s.y}</span> <span class="chip" style="background:#FBE0EE;color:#A0005C">${s.r}</span></td><td class="num">${s.rev} of ${s.n}</td><td class="num">${s.stale||'—'}</td><td class="num">${s.sub||'—'}</td><td class="num">${fm(s.roi)}</td></tr>`).join('')}</table>
 <p class="note">Click a consultant to see their clients. Clients without a review are scored on ROI only.</p></div>
 <div class="card"><h4>Needs leadership attention</h4><table><tr><th>Client</th><th>Consultant</th><th>Health</th><th>Why</th></tr>${watch.map(({c,h})=>`<tr class="click" data-c="${c.id}"><td><b>${esc(c.name)}</b></td><td>${esc(FULL[c.con]||c.con)}</td><td>${rag(h.final)}</td><td>${esc([h.mismatch?'Rating differs from data':'',...(c.review?c.review.risk.filter(r=>r[1]==='R').map(r=>r[0]+': '+r[2]):[])].filter(Boolean).join(' · ')||'Overall Red')}</td></tr>`).join('')}</table></div>`;
 $$('[data-con]').forEach(b=>b.addEventListener('click',()=>{fCon=b.dataset.con;view='portfolio';render()}));bindOpen()}
function vPortfolio(){
 const cons=['All',...[...new Set(CLIENTS.map(c=>c.con))].sort()];
 let list=CLIENTS.filter(c=>(fCon==='All'||c.con===fCon)&&(fSt==='All'||(c.review?c.review.status:'Not started')===fSt));
 const rows=list.map(c=>({c,h:health(c)}));rows.sort(sortBy==='name'?(a,b)=>a.c.name.localeCompare(b.c.name):(a,b)=>(a.h.s.overall??999)-(b.h.s.overall??999));

 <button type="button" class="btn ${sortBy==='score'?'on':''}" data-s="score">Lowest health first</button><button type="button" class="btn ${sortBy==='name'?'on':''}" data-s="name">A–Z</button></div>

 $('#fcon').addEventListener('change',e=>{fCon=e.target.value;render()});$('#fst').addEventListener('change',e=>{fSt=e.target.value;render()});
 $$('[data-s]').forEach(b=>b.addEventListener('click',()=>{sortBy=b.dataset.s;render()}));bindOpen()}

function sec(n,t){return `<p class="sec">${n} · ${t}</p>`}
function vReview(){
 const list=visible();if(!cur||!list.some(c=>c.id===cur))cur=list[0].id;

 <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${stChip(c.review?c.review.status:'Not started')} <span class="note" style="margin:0">Calculated: ${chip(s.overall)} · Consultant rating: ${rag(c.review&&c.review.rating)}${c.review?` · Last updated ${fmtD(c.review.date)} by ${esc(c.review.by||'')}`:''}</span></div>${h.mismatch?`<p class="warnline">⚠ The consultant rating differs from what the data shows. Worth a conversation.</p>`:''}</div></div>`;
 if(!rv){$('#main').innerHTML=h1+`<div class="card"><h4>No client review yet</h4><p class="note">Only the 2025 ROI file is on record, so health is scored on Results alone (${s.p.results}).</p>${roiTable(c)}</div>`;wireReview(c);return}

 <h4 style="margin-block-start:14px">Summary</h4>${ed?`<textarea class="in" rows="3" data-f="summary" aria-label="Summary">${esc(rv.summary)}</textarea>`:`<div class="takeaway">${esc(rv.summary)}</div>`}
 <h4 style="margin-block-start:14px">I need help with…</h4>${ed?`<textarea class="in" rows="2" data-f="help" aria-label="I need help with">${esc(rv.help)}</textarea>`:`<p class="p">${esc(rv.help)||'<span class="note">Nothing raised.</span>'}</p>`}</div></div>
 ${sec(2,'Client health analysis')}<div class="kpis">${DIM.map(([k,l])=>{const v=s.p[k],b=band(v);return `<div class="kpi" style="border-block-start-color:${b[3]}"><div class="l">${l} <span class="note">(${W[k]}%)</span></div><div class="v" style="color:${b[3]}">${v??'—'}</div><div class="n">${chip(v)}</div><div class="n" style="margin-block-start:6px">${esc(s.w[k])}</div></div>`}).join('')}</div>

 return `<table><tr><td class="k">Overall ROI (dollar & ratio)</td><td>${tot!=null?'$'+Math.round(tot).toLocaleString('en-US')+' · '+(+ra).toFixed(1)+':1':'N/A'}</td></tr>

 <div class="grid2"><div class="card" id="r-trend"><h4>Trends · 2024 vs 2025 benefit</h4><div class="legend2"><span><i style="background:#9CC3EA"></i>2024</span><span><i style="background:${C.purple}"></i>2025</span></div>${tr.map(x=>`<div class="trow click" data-cl="${x.c.id}"><span>${esc(x.c.name)}</span><div><div class="bar"><span style="inline-size:${x.a/tmx*100}%;background:#9CC3EA"></span></div><div class="bar" style="margin-block-start:3px"><span style="inline-size:${x.b/tmx*100}%;background:${C.purple}"></span></div></div><b style="text-align:end;color:${x.b>=x.a?'#00756E':'#A0005C'}">${x.a?((x.b/x.a-1)*100>=0?'+':'')+((x.b/x.a-1)*100).toFixed(0)+'%':'—'}</b></div>`).join('')||'<p class="note">No clients with both years.</p>'}</div>
 <div class="card" id="r-wf"><h4>Workflow value · 2025</h4>${wf.map(w=>`<div class="drv" style="grid-template-columns:190px 1fr 70px"><span>${esc(w[0])}</span><div class="bar"><span style="inline-size:${w[1]/wmx*100}%;background:${w[2]}"></span></div><b style="text-align:end">${fm(w[1])}</b></div>`).join('')}<p class="note">Context, not ROI: presumptive charity identified ${fm(charity)}.</p></div></div>`;wireHub()}
/* ---- client page additions ---- */
function tHealthX(c,rv,ed,h){const ew=earlyWarnings(c);return tHealth(c,rv,ed,h)+`<div class="card"><h4>Early warnings</h4>${ew.length?ew.map(w=>`<div class="row"><div><b>${esc(w[0])}</b><br><span style="font-size:12.5px;color:var(--gray)">${esc(w[1])}</span></div><span class="chip" style="background:${SEV[w[2]][1]};color:${SEV[w[2]][2]}">${SEV[w[2]][0]}</span></div>`).join(''):'<p class="note">No early warning signs right now.</p>'}</div>`}
function tSuccessX(c,rv,ed,h){const p=successPlan(c);return `<div class="grid2"><div class="card" style="border-inline-start:4px solid var(--purple)"><h4>Goals</h4>${rv?`<p class="p" style="color:var(--gray)">${esc(rv.why||'')}</p><p class="lbl">Organizational goals for CO</p>${listField('utilStrategy',rv,ed)}`:'<p class="note">No client profile yet.</p>'}</div>
 <div class="card" style="border-inline-start:4px solid var(--teal)"><h4>Success plan</h4><p class="p">Health today: ${rag(h.final)} → target: <b>${p.target}</b></p><p class="p" style="margin-block-start:4px">Next conversation: ${p.n?`<b>${esc(p.n.m[0])}</b>`:c.ops?'<span style="color:#A0005C">not booked</span>':'calendar not connected'}</p><p class="lbl">Plan</p>${ul(p.steps)}</div></div>`+tSuccess(c,rv,ed,h)}
function tROIX(c,rv,ed){const p=r24(c),t=tot25(c);const cash=(c.row.seg||0)+(c.row.med||0)+(c.row.rm||0)+(c.row.db||0);
 return tROI(c,rv,ed)+`<div class="grid2"><div class="card"><h4>Trend · 2024 vs 2025</h4>${p&&p.tot&&t?`<table><tr><th></th><th class="num">2024</th><th class="num">2025</th></tr><tr><td class="k">Benefit</td><td class="num">${fm(p.tot)}</td><td class="num">${fm(t)}</td></tr><tr><td class="k">ROI</td><td class="num">${p.ratio?(+p.ratio).toFixed(1)+':1':'—'}</td><td class="num">${(+c.row.ratio).toFixed(1)}:1</td></tr><tr><td class="k">Segmentation</td><td class="num">${fm(p.seg)}</td><td class="num">${fm(c.row.seg)}</td></tr><tr><td class="k">Medicaid</td><td class="num">${fm(p.med)}</td><td class="num">${fm(c.row.med)}</td></tr><tr><td class="k">Return mail</td><td class="num">${fm(p.rm)}</td><td class="num">${fm(c.row.rm)}</td></tr>${p.inv?`<tr><td class="k">2024 invoice</td><td class="num">${fm(p.inv)}</td><td></td></tr>`:''}</table>${c.row.h2d?'':'<p class="note">2025 is a partial year, so the change is not comparable yet.</p>'}<p class="note">Change: <b style="color:${t>=p.tot?'#00756E':'#A0005C'}">${((t/p.tot-1)*100).toFixed(0)}%</b>. Methods can differ between years; check what was counted before presenting a change.</p>`:`<p class="note">${p&&p.st?'2024 status: '+esc(p.st)+'. ':''}No two-year comparison available.</p>`}</div>
 <div class="card"><h4>Cash impact · 2025</h4>${t?`<p class="big" style="color:${C.teal}">${fm(cash)}</p><p class="p">${Math.round(cash/t*100)}% of the ${fm(t)} benefit is cash (collection lift, Medicaid payments, return mail and deceased/bankruptcy collections).</p>${c.row.ftec?`<p class="p" style="margin-block-start:6px">FTE cost avoided: ${fm(c.row.ftec)} (${Math.round(c.row.fteh||0).toLocaleString('en-US')} hours)</p>`:''}`:'<p class="note">No 2025 ROI yet.</p>'}</div></div>`}

</script>
